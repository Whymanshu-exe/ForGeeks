name: CI and EC2 deploy

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "deploy/**"
      - ".github/workflows/ci-cd.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "deploy/**"
      - ".github/workflows/ci-cd.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and schema
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/gfgrbu_test
      SESSION_SECRET: github-actions-test-secret
      RUN_DB_INTEGRATION: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gfgrbu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d gfgrbu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy to EC2 using SSM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/gfg-rbu-backend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=
          tags: ${{ steps.ecr.outputs.registry }}/gfg-rbu-frontend:${{ github.sha }}
      - name: Upload deployment files
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SHA: ${{ github.sha }}
        run: |
          aws s3 cp docker-compose.yml "s3://${DEPLOY_BUCKET}/releases/${SHA}/docker-compose.yml"
          aws s3 cp frontend/nginx.conf "s3://${DEPLOY_BUCKET}/releases/${SHA}/nginx.conf"
          aws s3 cp deploy/deploy-ec2.sh "s3://${DEPLOY_BUCKET}/releases/${SHA}/deploy-ec2.sh"
      - name: Deploy on EC2 through Systems Manager
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
        run: |
          COMMANDS=$(jq -n \
            --arg bucket "$DEPLOY_BUCKET" \
            --arg sha "$SHA" \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            '{commands: [ "set -eu",
               "mkdir -p /opt/geekgate/frontend /opt/geekgate/deploy",
               ("aws s3 cp s3://" + $bucket + "/releases/" + $sha + "/docker-compose.yml /opt/geekgate/docker-compose.yml"),
               ("aws s3 cp s3://" + $bucket + "/releases/" + $sha + "/nginx.conf /opt/geekgate/frontend/nginx.conf"),
               ("aws s3 cp s3://" + $bucket + "/releases/" + $sha + "/deploy-ec2.sh /opt/geekgate/deploy/deploy-ec2.sh"),
               ("chmod 700 /opt/geekgate/deploy/deploy-ec2.sh"),
               ("printf \"AWS_REGION=%s\\nECR_REGISTRY=%s\\n\" " + $region + " " + $registry + " > /opt/geekgate/deploy.env"),
               ("cd /opt/geekgate && ./deploy/deploy-ec2.sh " + $sha)
             ]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
